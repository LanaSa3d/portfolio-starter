  <link rel="preconnect" href="https://fonts.googleapis.com">

    rel="stylesheet">
  <!-- Tweaks + theme: restored before React boots so there is no colour flash. -->
  <script>
    (function () {
      var language = localStorage.getItem('yara_lang') === 'ar' ? 'ar' : 'en';
      document.documentElement.lang = language;
      document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
      var defaults = { palette: 'mizan', laptop: 'code', phone: 'apps' };
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem('yara_tweaks') || '{}') || {}; } catch (e) {}
      window.__tweaks = Object.assign({}, defaults, saved);
      // Same values as PALETTES in src/layout.jsx — applied here to avoid a flash of the wrong theme.
      var palettes = {
        mizan: ['#f3f0e6', '#e8e4d6', '#1f2a24', '#4c5a50', '#2f6b4f', '#a9c9b3', '#2c3a31'],
        night: ['#121815', '#1a221d', '#e6eee7', '#a3b3a7', '#7cc49a', '#2f5a42', '#5f7466'],
        sand:  ['#f4ede0', '#ebe1cf', '#2a2520', '#5a4f44', '#a8532f', '#e2b39a', '#3a2f26']
      };
      var names = ['--paper', '--paper-2', '--ink', '--ink-soft', '--accent', '--accent-soft', '--line'];
      var p = palettes[window.__tweaks.palette] || palettes.mizan;
      for (var i = 0; i < names.length; i++) document.documentElement.style.setProperty(names[i], p[i]);
      document.documentElement.dataset.theme = window.__tweaks.palette === 'night' ? 'dark' : 'light';
    })();
  </script>
